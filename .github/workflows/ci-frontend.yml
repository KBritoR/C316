name: CI Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint:
    name: Biome (lint e formatacao)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Verificar formatacao (Biome)
        run: npm run format:check

  test:
    name: Vitest e build
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Testes (Vitest + Testing Library)
        run: npm run test

      - name: Build de producao
        run: npm run build

  e2e:
    name: E2E full-stack (Playwright)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar o navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Subir a stack isolada e rodar o E2E (make e2e)
        run: make e2e

      - name: Publicar o relatorio do Playwright se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
